      - OTEL_SERVICE_NAME=accounts-service.default.svc.cluster.local
      - ASPNETCORE_URLS=http://+:8080
      - JWT__Audience=PE1hbmFnZWQgYnkgQXp1cmUgS2V5VmF1bHQ+
      - JWT__Issuer=PE1hbmFnZWQgYnkgQXp1cmUgS2V5VmF1bHQ+
