services:

########################################################################
# DATABASES and STORAGE
########################################################################
  pg:
    image: postgres:17.5
    container_name: ${CONTEXT_TAG}.postgresql
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    restart: "no"
    ports:
      - 5432:5432
    environment:
      POSTGRES_PASSWORD: Your_password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5


########################################################################
# LOGGING and MONITOR
########################################################################
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13
    deploy:
      resources:
        limits:
          cpus: '1.0' 
          memory: 2G 
        reservations:
          cpus: '1.0'
          memory: 2G
    restart: "no"
    ports:
      - 18888:18888
      - 18889:18889
    environment:
      - DASHBOARD__FRONTEND__AUTHMODE=Unsecured
    networks:
      - shared-net

########################################################################

  users-service.default.svc.cluster.local:
    image: users/webapi:${TAG:-latest}
    restart: "no"
    ports:
      - "55316:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=development
      - APP_IDENTIFIER_NAME=users-service.default.svc.cluster.local
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://aspire-dashboard:18889
      - OTEL_SERVICE_NAME=users-service.default.svc.cluster.local
      - ASPNETCORE_URLS=http://+:8080
      - JWT__Audience=PE1hbmFnZWQgYnkgQXp1cmUgS2V5VmF1bHQ+
      - JWT__Issuer=PE1hbmFnZWQgYnkgQXp1cmUgS2V5VmF1bHQ+
      - JWT__SecretKey=ZU8yOFF+dXN1Mk9BZkNyTX5LOUQ2b1JqQmNEeENyVTQwTUZNQWFlSg==
      - JWT__TimeToLive=1024
      - DbSettings__ConnectionString=SG9zdD1wZztQb3J0PTU0MzI7RGF0YWJhc2U9cG9zdGdyZXM7VXNlcm5hbWU9cG9zdGdyZXM7UGFzc3dvcmQ9WW91cl9wYXNzd29yZDEyMw==
    build:
      context: .
      dockerfile: DockerfileUsersApi
      target: final
      args:
        BUILD_CONFIGURATION: ${BUILD_CONFIGURATION:-Debug}
        BUILD_ENVIRONMENT: ${BUILD_ENVIRONMENT:-Development}
        ARCH: ${ARCH:-amd64}
        APP_VERSION: users-service.default.svc.cluster.local:${TAG:-latest}
    networks:
      - shared-net
    depends_on:
      pg:
        condition: service_healthy
      aspire-dashboard:
        condition: service_started
########################################################################

